[package]
name = "convoyrun-mobile"
version = "0.1.3"
edition = "2021"
description = "ConvoyRun Mobile"
license = "MIT OR Apache-2.0"

[lib]
name = "convoyrun_mobile_ffi"
crate-type = ["cdylib", "staticlib"]
path = "src/lib.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# Core iroh (transport + networking) — pinned to match desktop
iroh = "=1.0.3"

# Gossip protocol (topic subscription + broadcast)
iroh-gossip = "0.101"

# DHT peer discovery (Mainline DHT, same as desktop)
distributed-topic-tracker = { version = "0.3.5", features = ["iroh-gossip"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Crypto (for signature verification)
ed25519-dalek = "3.0"
base64 = "0.22"
hex = "0.4"

# Async runtime
tokio = { version = "1", features = ["full"] }
chrono = "0.4"

# UniFFI bindings generation
uniffi = { version = "0.29.4", features = ["cli"] }

# Android JNI support
[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.22"

[build-dependencies]
uniffi = { version = "0.29.4", features = ["build"] }

[profile.release]
lto = true
opt-level = "s"
strip = true
