name: Build Android & Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release with APK'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building ConvoyRun Mobile v$VERSION"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './mobile-ffi -> target'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;28.0.12433566'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate launcher icons
        run: |
          python3 -c "
          from PIL import Image, ImageDraw
          import os

          src = 'mobile-ffi/icons/icon.png'
          res = 'app/src/main/res'
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}

          img = Image.open(src).convert('RGBA')

          for density, size in sizes.items():
              out_dir = f'{res}/mipmap-{density}'
              os.makedirs(out_dir, exist_ok=True)

              # Square icon
              square = img.resize((size, size), Image.LANCZOS)
              square.save(f'{out_dir}/ic_launcher.png')

              # Round icon: circle crop
              mask = Image.new('L', (size, size), 0)
              draw = ImageDraw.Draw(mask)
              draw.ellipse((0, 0, size-1, size-1), fill=255)
              round_icon = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              round_icon.paste(square, (0, 0), mask)
              round_icon.save(f'{out_dir}/ic_launcher_round.png')

          print('Icons generated')
          "

      - name: Decode keystore
        if: ${{ github.event.inputs.create_release == 'true' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Build APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "dist/ConvoyRun-Mobile-${{ steps.get_version.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ConvoyRun-Mobile-${{ steps.get_version.outputs.version }}
          path: dist/*

  release:
    needs: build
    if: github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: ConvoyRun-Mobile-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ steps.get_version.outputs.version }}
          name: ConvoyRun Mobile v${{ steps.get_version.outputs.version }}
          files: dist/*
          generate_release_notes: true
